<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E5A — Révision BTS NDRC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--paper:#FAFAF8;--ink:#1C1917;--muted:#78716C;--border:#E7E5E4;--r:10px;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Geist',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;}
  h1,h2,h3{font-family:'Bricolage Grotesque',sans-serif;}
  button{cursor:pointer;font-family:'Geist',sans-serif;}
  .page{max-width:880px;margin:0 auto;padding:24px 16px 80px;}
  nav{background:#fff;border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:52px;position:sticky;top:0;z-index:100;}
  .nav-logo{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:1.05em;}
  .xp-badge{background:#F0FDFA;color:#0D9488;border-radius:20px;padding:4px 12px;font-size:.85em;font-weight:600;}
  .btn-back{background:none;border:1px solid var(--border);border-radius:6px;padding:6px 14px;font-size:.88em;color:var(--ink);}
  .btn-back:hover{background:var(--border);}
  .hub-header{text-align:center;padding:40px 0 28px;}
  .hub-header h1{font-size:2.2em;font-weight:800;margin-bottom:8px;}
  .hub-header p{color:var(--muted);font-size:.95em;}
  .comps-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-bottom:24px;}
  .comp-card{border-radius:var(--r);border:2px solid transparent;padding:20px;cursor:pointer;transition:transform .15s,box-shadow .15s;}
  .comp-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.1);}
  .chip{border-radius:20px;padding:2px 8px;font-size:.75em;font-weight:500;display:inline-block;}
  .mode-bar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0;}
  .mode-btn{border:none;border-radius:8px;padding:10px 18px;font-size:.9em;font-weight:600;transition:opacity .15s;}
  .mode-btn:hover{opacity:.85;}
  .comp-hero{border-radius:var(--r);padding:28px;margin-bottom:24px;}
  .bloc-block{margin-bottom:24px;}
  .bloc-block h4{font-size:1em;font-weight:700;padding:8px 14px;border-radius:6px;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
  .point-card{background:#fff;border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:10px;}
  .point-card h5{font-size:.95em;font-weight:700;margin-bottom:6px;}
  .point-card p{font-size:.88em;line-height:1.65;color:#3C3836;}
  .memo{margin-top:8px;padding:6px 10px;border-radius:6px;font-size:.8em;font-weight:600;}
  .flash-container{display:flex;flex-direction:column;align-items:center;gap:20px;padding:20px 0;}
  .flash-progress{width:100%;max-width:500px;background:var(--border);border-radius:4px;height:6px;}
  .flash-bar{height:6px;border-radius:4px;transition:width .3s;}
  .flash-card{width:100%;max-width:500px;min-height:220px;border-radius:12px;border:2px solid var(--border);background:#fff;padding:32px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;transition:transform .1s;position:relative;}
  .flash-card:active{transform:scale(.98);}
  .flash-q{font-size:1.05em;font-weight:600;line-height:1.5;}
  .flash-a{font-size:.93em;line-height:1.6;}
  .flash-ex{font-size:.82em;color:var(--muted);margin-top:10px;font-style:italic;}
  .flash-hint{font-size:.78em;color:var(--muted);position:absolute;bottom:12px;}
  .flash-actions{display:flex;gap:12px;}
  .flash-nav{background:#fff;border:2px solid var(--border);border-radius:8px;padding:10px 24px;font-weight:600;font-size:.9em;}
  .flash-nav:hover{background:var(--border);}
  .fill-question{background:#fff;border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:14px;}
  .fill-sentence{font-size:1em;line-height:2.4;margin-bottom:8px;}
  .fill-input{border:2px solid var(--border);border-radius:6px;padding:6px 12px;font-size:.95em;font-family:'Geist',sans-serif;min-width:180px;transition:border-color .2s;}
  .fill-input:focus{outline:none;border-color:#0D9488;}
  .fill-input.correct{border-color:#16A34A;background:#F0FDF4;}
  .fill-input.wrong{border-color:#E11D48;background:#FFF1F2;}
  .match-game{display:flex;gap:16px;margin-bottom:20px;}
  .match-col{flex:1;display:flex;flex-direction:column;gap:8px;}
  .match-col h5{font-size:.82em;font-weight:700;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em;}
  .match-item{background:#fff;border:2px solid var(--border);border-radius:8px;padding:12px 14px;font-size:.85em;cursor:pointer;transition:all .15s;line-height:1.4;}
  .match-item:hover{border-color:#0D9488;background:#F0FDFA;}
  .match-item.selected{border-color:#0D9488;background:#CCFBF1;}
  .match-item.matched{border-color:#16A34A;background:#F0FDF4;opacity:.6;cursor:default;}
  .match-item.wrong-anim{border-color:#E11D48;background:#FFF1F2;animation:shake .35s;}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .essai-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:22px;margin-bottom:14px;}
  .essai-card h4{font-size:1em;font-weight:700;margin-bottom:12px;line-height:1.45;}
  .essai-pistes{list-style:none;}
  .essai-pistes li{font-size:.88em;padding:5px 0;border-bottom:1px solid var(--border);color:#57534E;}
  .essai-pistes li:last-child{border:none;}
  .essai-pistes li::before{content:'→  ';color:#0D9488;font-weight:700;}
  .score-box{text-align:center;padding:40px 20px;}
  .big-num{font-size:3em;font-weight:800;font-family:'Bricolage Grotesque',sans-serif;}
  .btn-primary{border:none;border-radius:8px;padding:12px 28px;font-weight:700;font-size:.95em;background:#0D9488;color:#fff;cursor:pointer;}
  .btn-primary:hover{opacity:.9;}
  .btn-ghost{border:2px solid var(--border);border-radius:8px;padding:12px 28px;font-weight:600;font-size:.9em;background:none;cursor:pointer;}
  .filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .filter-btn{border:1px solid var(--border);border-radius:20px;padding:5px 14px;font-size:.82em;font-weight:500;background:#fff;cursor:pointer;}
  .filter-btn.on{background:#1C1917;color:#fff;border-color:#1C1917;}
  .modes-global{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px;max-width:560px;margin-left:auto;margin-right:auto;}
  .mode-tile{border-radius:10px;padding:16px 10px;text-align:center;cursor:pointer;border:2px solid #CCFBF1;background:#F0FDFA;transition:transform .15s;}
  .mode-tile:hover{transform:translateY(-2px);}
  .mode-tile .icon{font-size:1.8em;margin-bottom:6px;}
  .mode-tile h4{font-size:.84em;font-weight:700;}
  .mode-tile p{font-size:.7em;opacity:.65;margin-top:2px;}
  /* Calculs mode */
  .formule-section{margin-bottom:28px;}
  .formule-header{border-radius:8px;padding:12px 16px;font-weight:700;font-size:.95em;margin-bottom:12px;}
  .formule-table{width:100%;border-collapse:collapse;}
  .formule-table th{font-size:.78em;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:8px 12px;border-bottom:2px solid var(--border);}
  .formule-table td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:.88em;vertical-align:top;}
  .formule-table tr:last-child td{border-bottom:none;}
  .formule-name{font-weight:600;color:var(--ink);}
  .formule-formula{font-family:'JetBrains Mono',monospace;font-size:.85em;color:#1D4ED8;background:#EFF6FF;padding:3px 8px;border-radius:4px;white-space:nowrap;}
  .formule-ex{font-size:.8em;color:var(--muted);font-style:italic;}
  @media(max-width:600px){
    .comps-grid{grid-template-columns:1fr;}
    .match-game{flex-direction:column;}
    .modes-global{grid-template-columns:1fr 1fr;}
    .formule-table td:last-child{display:none;}
  }
</style>
</head>
<body>
<nav>
  <span class="nav-logo">📋 E5A — BTS NDRC</span>
  <div style="display:flex;gap:8px;align-items:center;">
    <span class="xp-badge" id="xp-display">0 XP</span>
    <button class="btn-back" id="btn-home" style="display:none">← Accueil</button>
  </div>
</nav>
<div class="page" id="app"></div>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="app/e5a-data.js"></script>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback}=React;
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
const getComp=id=>E5A_COMP.find(c=>c.id===id);
const getCol=id=>getComp(id)?.color||{solid:'#0D9488',bg:'#F0FDFA',ink:'#134E4A',soft:'#CCFBF1',text:'#fff'};

function useStore(){
  const KEY='e5a_v1';
  const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||{};}catch{return{};}};
  const [s,setS]=useState(load);
  const addXP=useCallback(n=>{setS(prev=>{const nx={...prev,xp:(prev.xp||0)+n};localStorage.setItem(KEY,JSON.stringify(nx));return nx;});},[]);
  return {xp:s.xp||0,addXP};
}

// FLASH
function Flash({cards,col,addXP,onBack}){
  const [i,setI]=useState(0);
  const [flipped,setFlipped]=useState(false);
  const [done,setDone]=useState([]);
  const c=cards[i];
  if(!c)return <div className="score-box"><p style={{color:'var(--muted)'}}>Aucune flashcard disponible.</p><button className="btn-ghost" onClick={onBack}>Retour</button></div>;
  const pct=Math.round(done.length/cards.length*100);
  const next=knew=>{
    if(knew){addXP(2);setDone(d=>[...d,c.id]);}
    setFlipped(false);
    setTimeout(()=>setI(x=>Math.min(x+1,cards.length-1)),80);
  };
  const finished=i>=cards.length-1&&flipped;
  return(
    <div className="flash-container">
      <div style={{width:'100%',maxWidth:500,display:'flex',justifyContent:'space-between'}}>
        <span style={{fontSize:'.85em',color:'var(--muted)'}}>{i+1} / {cards.length}</span>
        <span style={{fontSize:'.85em',color:'var(--muted)'}}>✅ {done.length} maîtrisées</span>
      </div>
      <div className="flash-progress"><div className="flash-bar" style={{width:pct+'%',background:col.solid}}/></div>
      <div className="flash-card" onClick={()=>setFlipped(f=>!f)}
        style={{borderColor:flipped?col.solid:'var(--border)',background:flipped?col.bg:'#fff'}}>
        {!flipped
          ?<><div className="flash-q">{c.q}</div><span className="flash-hint">👆 Cliquer pour voir la réponse</span></>
          :<><div className="flash-a" style={{color:col.ink}}>{c.r}</div>{c.ex&&<div className="flash-ex">💡 {c.ex}</div>}</>
        }
      </div>
      {flipped
        ?<div className="flash-actions">
            <button className="flash-nav" style={{color:'#E11D48',borderColor:'#E11D48'}} onClick={()=>next(false)}>✗ À revoir</button>
            <button className="flash-nav" style={{color:'#16A34A',borderColor:'#16A34A'}} onClick={()=>next(true)}>✓ Je sais +2XP</button>
          </div>
        :<div className="flash-actions">
            <button className="flash-nav" onClick={()=>{setFlipped(false);setI(x=>Math.max(x-1,0));}} disabled={i===0}>←</button>
            <button className="flash-nav" onClick={()=>setFlipped(true)}>Révéler</button>
            <button className="flash-nav" onClick={()=>next(false)} disabled={i===cards.length-1}>→</button>
          </div>
      }
      {finished&&done.length>0&&(
        <div className="score-box">
          <div className="big-num" style={{color:col.solid}}>{pct}%</div>
          <p style={{color:'var(--muted)',marginTop:8}}>{done.length}/{cards.length} maîtrisées · +{done.length*2} XP</p>
          <button className="btn-primary" style={{marginTop:16,background:col.solid}} onClick={onBack}>Retour</button>
        </div>
      )}
    </div>
  );
}

// FILL
function Fill({qs,addXP,onBack}){
  const [ans,setAns]=useState({});
  const [checked,setChecked]=useState(false);
  const [xpG,setXpG]=useState(0);
  const ok=q=>{
    const a=(ans[q.id]||'').trim().toLowerCase();
    const t=q.trou.toLowerCase();
    return a===t||a.includes(t.slice(0,Math.min(6,t.length)));
  };
  const check=()=>{
    let xp=0;qs.forEach(q=>{if(ok(q))xp+=2;});
    addXP(xp);setXpG(xp);setChecked(true);
  };
  const corr=checked?qs.filter(ok).length:0;
  return(
    <div>
      {qs.map(q=>{
        const col=getCol(q.comp);
        const c=checked&&ok(q);const w=checked&&!ok(q);
        return(
          <div key={q.id} className="fill-question">
            <span className="chip" style={{background:col.soft,color:col.ink,marginBottom:8}}>{q.comp} — {q.thematique}</span>
            <div className="fill-sentence">
              {q.avant}&nbsp;
              <input className={'fill-input'+(c?' correct':w?' wrong':'')}
                value={ans[q.id]||''} disabled={checked} placeholder="…"
                onChange={e=>setAns(a=>({...a,[q.id]:e.target.value}))}/>
              &nbsp;{q.apres}
            </div>
            <div style={{fontSize:'.8em',color:'var(--muted)'}}>💡 {q.indice}</div>
            {w&&<div style={{fontSize:'.85em',color:'#16A34A',fontWeight:600,marginTop:4}}>✓ {q.trou}</div>}
          </div>
        );
      })}
      {!checked
        ?<button className="btn-primary" onClick={check} style={{marginTop:8}}>Vérifier</button>
        :<div className="score-box">
            <div className="big-num">{corr}/{qs.length}</div>
            <p style={{color:'var(--muted)',marginTop:8}}>+{xpG} XP gagnés !</p>
            <div style={{display:'flex',gap:12,justifyContent:'center',marginTop:16}}>
              <button className="btn-ghost" onClick={()=>{setAns({});setChecked(false);}}>Réessayer</button>
              <button className="btn-primary" onClick={onBack}>Retour</button>
            </div>
          </div>
      }
    </div>
  );
}

// MATCH
function Match({game,col,addXP,onBack}){
  const leftItems=useRef(shuffle(game.paires.map(p=>p.g)));
  const rightItems=useRef(shuffle(game.paires.map(p=>p.d)));
  const [lSel,setLSel]=useState(null);
  const [rSel,setRSel]=useState(null);
  const [matched,setMatched]=useState([]);
  const [wrongPair,setWrongPair]=useState(null);

  useEffect(()=>{
    if(lSel===null||rSel===null)return;
    const pair=game.paires.find(p=>p.g===lSel);
    if(pair&&pair.d===rSel){
      addXP(3);setMatched(m=>[...m,lSel]);setLSel(null);setRSel(null);
    }else{
      setWrongPair([lSel,rSel]);
      setTimeout(()=>{setWrongPair(null);setLSel(null);setRSel(null);},700);
    }
  },[lSel,rSel]);

  const done=matched.length===game.paires.length;
  return(
    <div>
      <p style={{color:'var(--muted)',fontSize:'.88em',marginBottom:12}}>
        Sélectionne un terme puis sa définition.&nbsp;
        <strong style={{color:col.solid}}>{matched.length}/{game.paires.length} paires</strong>
      </p>
      <div className="match-game">
        <div className="match-col">
          <h5>Terme</h5>
          {leftItems.current.map(g=>{
            const isM=matched.includes(g);
            const isW=wrongPair&&wrongPair[0]===g;
            const isSel=lSel===g;
            return(
              <div key={g}
                className={'match-item'+(isM?' matched':isSel?' selected':isW?' wrong-anim':'')}
                style={isSel?{borderColor:col.solid,background:col.bg}:{}}
                onClick={()=>!isM&&!wrongPair&&setLSel(g)}
              >{g}</div>
            );
          })}
        </div>
        <div className="match-col">
          <h5>Définition</h5>
          {rightItems.current.map(d=>{
            const pair=game.paires.find(p=>p.d===d);
            const isM=pair&&matched.includes(pair.g);
            const isW=wrongPair&&wrongPair[1]===d;
            const isSel=rSel===d;
            return(
              <div key={d}
                className={'match-item'+(isM?' matched':isSel?' selected':isW?' wrong-anim':'')}
                style={isSel?{borderColor:col.solid,background:col.bg}:{}}
                onClick={()=>!isM&&!wrongPair&&lSel&&setRSel(d)}
              >{d}</div>
            );
          })}
        </div>
      </div>
      {done&&(
        <div className="score-box">
          <div className="big-num" style={{color:col.solid}}>🎉</div>
          <p style={{color:'var(--muted)',marginTop:8}}>Parfait ! +{game.paires.length*3} XP</p>
          <button className="btn-primary" style={{marginTop:16,background:col.solid}} onClick={onBack}>Retour</button>
        </div>
      )}
    </div>
  );
}

// CALCULS
function Calculs({onBack}){
  return(
    <div>
      <p style={{color:'var(--muted)',fontSize:'.9em',marginBottom:20}}>
        Toutes les formules à maîtriser pour les calculs de KPIs en Dossier 2.
      </p>
      {E5A_FORMULES.map((sec,si)=>{
        const c=sec.couleur;
        return(
          <div key={si} className="formule-section">
            <div className="formule-header" style={{background:c.bg,color:c.ink}}>{sec.categorie}</div>
            <table className="formule-table">
              <thead>
                <tr>
                  <th>Indicateur</th>
                  <th>Formule</th>
                  <th>Exemple</th>
                </tr>
              </thead>
              <tbody>
                {sec.formules.map((f,fi)=>(
                  <tr key={fi} style={{background:fi%2===0?'#fff':c.bg+'44'}}>
                    <td><span className="formule-name">{f.nom}</span></td>
                    <td><span className="formule-formula">{f.formule}</span></td>
                    <td><span className="formule-ex">{f.ex}</span></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        );
      })}
    </div>
  );
}

// STUDY VIEW
function Study({comp}){
  const col=comp.color;
  return(
    <div>
      <div className="comp-hero" style={{background:col.bg,color:col.ink}}>
        <div style={{fontSize:'2.2em',marginBottom:8}}>{comp.icon}</div>
        <h2 style={{fontFamily:'Bricolage Grotesque',fontWeight:800,fontSize:'1.4em'}}>C{comp.num} — {comp.titre}</h2>
        <p style={{opacity:.75,marginTop:4,fontSize:'.9em'}}>{comp.blocs.length} bloc{comp.blocs.length>1?'s':''} · {comp.blocs.reduce((s,b)=>s+(b.points||[]).length,0)} points clés</p>
      </div>
      {comp.blocs.map((bl,bi)=>(
        <div key={bi} className="bloc-block">
          <h4 style={{background:col.soft,color:col.ink}}>
            <span style={{background:col.solid,color:'#fff',borderRadius:'50%',width:22,height:22,display:'inline-flex',alignItems:'center',justifyContent:'center',fontSize:'.78em',flexShrink:0}}>{bl.num||bi+1}</span>
            Bloc {bl.num} — {bl.titre}
          </h4>
          {(bl.points||[]).map((pt,pi)=>(
            <div key={pi} className="point-card">
              <h5>{pt.titre}</h5>
              <p dangerouslySetInnerHTML={{__html:pt.contenu}}/>
              {pt.memo&&<div className="memo" style={{background:col.soft,color:col.ink}}>🧠 {pt.memo}</div>}
            </div>
          ))}
        </div>
      ))}
    </div>
  );
}

// COMP PAGE
function CompPage({comp,addXP,onBack}){
  const [sub,setSub]=useState('study');
  const col=comp.color;
  const flash=shuffle(E5A_FLASH.filter(f=>f.comp===comp.id));
  const fill=E5A_FILL.filter(f=>f.comp===comp.id);
  const matchGames=E5A_MATCH.filter(m=>m.comp===comp.id);
  const [matchIdx,setMatchIdx]=useState(0);
  const matchG=matchGames[matchIdx]||null;

  return(
    <div>
      <div style={{marginBottom:16}}>
        <h2 style={{fontFamily:'Bricolage Grotesque',fontWeight:800,fontSize:'1.25em'}}>{comp.icon} C{comp.num} — {comp.titre}</h2>
        <p style={{color:'var(--muted)',fontSize:'.85em'}}>{comp.blocs.length} blocs de compétences</p>
      </div>
      <div className="mode-bar">
        {[
          {id:'study',label:'📖 Cours'},
          {id:'flash',label:`⚡ Flash (${flash.length})`},
          {id:'fill', label:`✏️ Exercices (${fill.length})`},
          matchGames.length>0?{id:'match',label:`🔗 Match (${matchGames.length})`}:null,
        ].filter(Boolean).map(m=>(
          <button key={m.id} className="mode-btn"
            style={{background:sub===m.id?col.solid:col.bg,color:sub===m.id?col.text:col.ink,
                    outline:sub===m.id?`3px solid ${col.solid}`:'none',outlineOffset:2}}
            onClick={()=>setSub(m.id)}
          >{m.label}</button>
        ))}
      </div>
      {sub==='study'&&<Study comp={comp}/>}
      {sub==='flash'&&<Flash cards={flash} col={col} addXP={addXP} onBack={()=>setSub('study')}/>}
      {sub==='fill' &&<Fill qs={fill} addXP={addXP} onBack={()=>setSub('study')}/>}
      {sub==='match'&&matchG&&(
        <div>
          {matchGames.length>1&&(
            <div className="filter-bar">
              {matchGames.map((g,i)=>(
                <button key={g.id} className={'filter-btn'+(matchIdx===i?' on':'')} onClick={()=>setMatchIdx(i)}>
                  {g.titre}
                </button>
              ))}
            </div>
          )}
          <Match key={matchG.id} game={matchG} col={col} addXP={addXP} onBack={()=>setSub('study')}/>
        </div>
      )}
    </div>
  );
}

// GLOBAL FLASH
function GlobalFlash({addXP,onBack}){
  const [f,setF]=useState('ALL');
  const col={solid:'#0D9488',bg:'#F0FDFA',ink:'#134E4A',soft:'#CCFBF1',text:'#fff'};
  const cards=shuffle(f==='ALL'?E5A_FLASH:E5A_FLASH.filter(x=>x.comp===f));
  return(
    <div>
      <div className="filter-bar">
        <button className={'filter-btn'+(f==='ALL'?' on':'')} onClick={()=>setF('ALL')}>Toutes</button>
        {E5A_COMP.map(c=>(
          <button key={c.id}
            className={'filter-btn'+(f===c.id?' on':'')}
            style={f===c.id?{background:c.color.solid,color:'#fff',border:'none'}:{}}
            onClick={()=>setF(c.id)}
          >{c.id}</button>
        ))}
      </div>
      <Flash cards={cards} col={col} addXP={addXP} onBack={onBack}/>
    </div>
  );
}

// GLOBAL FILL
function GlobalFill({addXP,onBack}){
  const [f,setF]=useState('ALL');
  const qs=shuffle(f==='ALL'?E5A_FILL:E5A_FILL.filter(x=>x.comp===f));
  return(
    <div>
      <div className="filter-bar">
        <button className={'filter-btn'+(f==='ALL'?' on':'')} onClick={()=>setF('ALL')}>Toutes</button>
        {E5A_COMP.map(c=>(
          <button key={c.id}
            className={'filter-btn'+(f===c.id?' on':'')}
            style={f===c.id?{background:c.color.solid,color:'#fff',border:'none'}:{}}
            onClick={()=>setF(c.id)}
          >{c.id}</button>
        ))}
      </div>
      <Fill qs={qs} addXP={addXP} onBack={onBack}/>
    </div>
  );
}

// ARGUMENTATION (ESSAI)
function Argumentation({onBack}){
  const [f,setF]=useState('ALL');
  const list=f==='ALL'?E5A_ESSAI:E5A_ESSAI.filter(e=>e.comps.includes(f));
  return(
    <div>
      <div className="filter-bar">
        <button className={'filter-btn'+(f==='ALL'?' on':'')} onClick={()=>setF('ALL')}>Tous</button>
        {E5A_COMP.map(c=>(
          <button key={c.id}
            className={'filter-btn'+(f===c.id?' on':'')}
            style={f===c.id?{background:c.color.solid,color:'#fff',border:'none'}:{}}
            onClick={()=>setF(c.id)}
          >{c.id}</button>
        ))}
      </div>
      {list.map(e=>(
        <div key={e.id} className="essai-card">
          <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:10}}>
            {e.comps.map(cid=>{const c=getComp(cid);return c?<span key={cid} className="chip" style={{background:c.color.soft,color:c.color.ink}}>{cid}</span>:null;})}
          </div>
          <h4>❓ {e.q}</h4>
          <ul className="essai-pistes">{e.pistes.map((p,i)=><li key={i}>{p}</li>)}</ul>
        </div>
      ))}
    </div>
  );
}

// HUB
function Hub({onComp,onMode}){
  const totalFlash=E5A_FLASH.length;
  const totalFill=E5A_FILL.length;
  const totalEssai=E5A_ESSAI.length;
  const totalFormules=E5A_FORMULES.reduce((s,sec)=>s+sec.formules.length,0);
  return(
    <div>
      <div className="hub-header">
        <h1>BTS NDRC — E5A</h1>
        <p>Relation Client à Distance &amp; Digitalisation</p>
        <p style={{fontSize:'.85em',color:'var(--muted)',marginTop:4}}>
          {E5A_COMP.length} compétences · {totalFlash} flashcards · {totalFill} exercices · {totalFormules} formules
        </p>
        <div className="modes-global">
          {[
            {id:'flash-all',icon:'⚡',label:'Flashcards',sub:totalFlash+' cartes'},
            {id:'fill-all', icon:'✏️',label:'Exercices',sub:'Textes à trous'},
            {id:'calculs',  icon:'📐',label:'Calculs',sub:totalFormules+' formules'},
            {id:'argumentation',icon:'📝',label:'Argumentation',sub:totalEssai+' sujets'},
          ].map(m=>(
            <div key={m.id} className="mode-tile" onClick={()=>onMode(m.id)}>
              <div className="icon">{m.icon}</div>
              <h4>{m.label}</h4>
              <p>{m.sub}</p>
            </div>
          ))}
        </div>
      </div>
      <h3 style={{fontFamily:'Bricolage Grotesque',fontWeight:700,fontSize:'1.05em',marginBottom:14}}>Étudier par compétence</h3>
      <div className="comps-grid">
        {E5A_COMP.map(c=>{
          const col=c.color;
          const cf=E5A_FLASH.filter(f=>f.comp===c.id).length;
          const cfl=E5A_FILL.filter(f=>f.comp===c.id).length;
          return(
            <div key={c.id} className="comp-card"
              style={{background:col.bg,borderColor:col.soft}}
              onClick={()=>onComp(c.id)}
            >
              <div style={{fontSize:'1.8em',marginBottom:6}}>{c.icon}</div>
              <div style={{fontSize:'.72em',fontWeight:700,color:col.solid,marginBottom:3}}>Compétence {c.num}</div>
              <h3 style={{color:col.ink,fontSize:'1em',fontWeight:700,lineHeight:1.35,marginBottom:8}}>{c.titre}</h3>
              <div style={{display:'flex',flexWrap:'wrap',gap:4,marginBottom:10}}>
                {c.blocs.map((bl,i)=>(
                  <span key={i} className="chip" style={{background:col.soft,color:col.ink}}>Bloc {bl.num}</span>
                ))}
              </div>
              <div style={{fontSize:'.78em',fontWeight:600,color:col.solid}}>
                {cf} flash · {cfl} exercices
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// APP ROOT
function App(){
  const {xp,addXP}=useStore();
  const [view,setView]=useState('hub');

  useEffect(()=>{
    document.getElementById('xp-display').textContent=xp+' XP';
  },[xp]);

  useEffect(()=>{
    const btn=document.getElementById('btn-home');
    btn.style.display=view!=='hub'?'inline-block':'none';
    btn.onclick=()=>setView('hub');
    window.scrollTo(0,0);
  },[view]);

  const cid=view.startsWith('c:')?view.slice(2):null;
  const comp=cid?E5A_COMP.find(c=>c.id===cid):null;

  const titles={
    'flash-all':'⚡ Flashcards — toutes compétences',
    'fill-all':'✏️ Exercices à trous',
    'calculs':'📐 Formules de calcul',
    'argumentation':'📝 Sujets d\'argumentation',
  };

  return(
    <>
      {view==='hub'&&<Hub onComp={id=>setView('c:'+id)} onMode={setView}/>}
      {comp&&<CompPage comp={comp} addXP={addXP} onBack={()=>setView('hub')}/>}
      {['flash-all','fill-all','calculs','argumentation'].includes(view)&&(
        <><h2 style={{fontFamily:'Bricolage Grotesque',fontWeight:800,marginBottom:16}}>{titles[view]}</h2>
        {view==='flash-all'&&<GlobalFlash addXP={addXP} onBack={()=>setView('hub')}/>}
        {view==='fill-all'&&<GlobalFill addXP={addXP} onBack={()=>setView('hub')}/>}
        {view==='calculs'&&<Calculs onBack={()=>setView('hub')}/>}
        {view==='argumentation'&&<Argumentation onBack={()=>setView('hub')}/>}
        </>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<App/>);
</script>
</body>
</html>
