<style>
  :root {
    --font-display: 'Bricolage Grotesque', system-ui, sans-serif;
    --font-ui: 'Geist', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
    --paper: oklch(0.97 0.012 85);
    --ink: oklch(0.22 0.02 280);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-ui);
    background:
      radial-gradient(circle at 0% 0%, oklch(0.96 0.04 50) 0%, transparent 50%),
      radial-gradient(circle at 100% 0%, oklch(0.96 0.04 250) 0%, transparent 45%),
      radial-gradient(circle at 50% 100%, oklch(0.96 0.04 145) 0%, transparent 50%),
      var(--paper);
    background-attachment: fixed;
    color: var(--ink);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  button { font-family: var(--font-ui); }
  .hov-lift { transition: transform .15s ease, box-shadow .15s ease; }
  .hov-lift:hover { transform: translateY(-2px); box-shadow: 0 12px 28px -12px rgba(20,15,40,0.22); }
  input.blank-input {
    display: inline-block;
    border: none;
    background: white;
    border-bottom: 2px solid oklch(0.55 0.16 320);
    padding: 4px 8px;
    font: inherit;
    font-weight: 600;
    color: oklch(0.22 0.02 280);
    border-radius: 6px 6px 0 0;
    min-width: 90px;
    margin: 0 2px;
    outline: none;
    transition: border-color .15s ease, background .15s ease;
  }
  input.blank-input:focus { border-color: oklch(0.55 0.16 250); background: oklch(0.97 0.02 250); }
  input.blank-input:disabled { cursor: default; }
  @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
  ::selection { background: oklch(0.85 0.16 75); color: oklch(0.22 0.02 280); }
</style>
</head>
<body>
<div id="root"></div>
