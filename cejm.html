<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>CEJM · Révision BTS</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --font-display: 'Bricolage Grotesque', system-ui, sans-serif;
    --font-ui: 'Geist', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
    --paper: oklch(0.97 0.012 85);
    --ink: oklch(0.22 0.02 280);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-ui);
    background:
      radial-gradient(circle at 0% 0%,   oklch(0.96 0.04 255) 0%, transparent 50%),
      radial-gradient(circle at 100% 0%,  oklch(0.96 0.04 55)  0%, transparent 45%),
      radial-gradient(circle at 50% 100%, oklch(0.96 0.04 155) 0%, transparent 50%),
      var(--paper);
    background-attachment: fixed;
    color: var(--ink);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  button { font-family: var(--font-ui); }
  .hov-lift { transition: transform .15s ease, box-shadow .15s ease; }
  .hov-lift:hover { transform: translateY(-2px); box-shadow: 0 12px 28px -12px rgba(20,15,40,0.22); }
  @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
  @keyframes lbIn    { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: scale(1); } }
  ::selection { background: oklch(0.85 0.16 255); color: oklch(0.22 0.02 280); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="cejm-app/data.js"></script>
<script src="cejm-app/store.js"></script>
<script type="text/babel" src="cejm-app/ui.jsx"></script>
<script type="text/babel" src="cejm-app/hub.jsx"></script>
<script type="text/babel" src="cejm-app/themes.jsx"></script>
<script type="text/babel" src="cejm-app/flash.jsx"></script>
<script type="text/babel" src="cejm-app/quiz.jsx"></script>
<script type="text/babel" src="cejm-app/matching.jsx"></script>
<script type="text/babel" src="cejm-app/docs.jsx"></script>
<script type="text/babel" src="cejm-app/main.jsx"></script>
</body>
</html>
